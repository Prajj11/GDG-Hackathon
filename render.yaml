services:
  - type: web
    name: digital-guardrails-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    plan: free
    envVars:
      - key: DATABASE_URL
        value: sqlite:////var/data/digital_guardrails.db
      - key: DETECTOR
        value: baseline
      - key: TRAIN_INDICBERT
        value: "false"
      - key: DEMO_ACCESS_TOKEN
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
